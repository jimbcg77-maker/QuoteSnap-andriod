name: Build QuoteSnap APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace
      - name: Validate APK package, contents and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          unzip -Z1 "$APK" | tee apk-contents.txt
          grep -Fxq 'assets/index.html' apk-contents.txt
          grep -Fxq 'classes.dex' apk-contents.txt
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-package.txt
          grep -q "package: name='com.quotesnap.fresh'" apk-package.txt
          grep -q "launchable-activity: name='com.quotesnap.app.MainActivity'" apk-package.txt
          sha256sum "$APK" | tee apk-sha256.txt
          ls -lh "$APK"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: QuoteSnap-Android-APK-Verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload APK verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuoteSnap-APK-Diagnostics
          path: |
            apk-contents.txt
            apk-signature.txt
            apk-package.txt
            apk-sha256.txt
          if-no-files-found: ignore
