plugins { id 'com.android.application' }

android {
    namespace 'com.quotesnap.app'
    compileSdk 35

    defaultConfig {
        // New application ID allows clean installation without overwriting any older QuoteSnap install.
        applicationId 'com.quotesnap.fresh'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
